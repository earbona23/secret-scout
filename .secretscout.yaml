# Rutas de este repo que contienen secretos FICTICIOS a propósito (fixtures y ejemplos).
# Por eso el auto-escaneo del CI puede pasar sin desactivar nada.
ignore_paths:
  - "rules/rules.yaml"     # cada regla trae un ejemplo ficticio que debe atrapar
  - "scout/demo.py"        # el repo demo planta secretos inventados
  - "tests/**"             # los tests usan valores ficticios
  - "README.md"            # el README muestra ejemplos de salida
